name: Generate and Play TTS Audio

on:
  workflow_dispatch:
    inputs:
      model_onnx_url:
        description: 'Raw HuggingFace ONNX URL'
        required: true
        default: 'https://huggingface.co/micahchoo/piper-kn/resolve/main/kn_IN-syspin_male-medium.onnx'
      model_json_url:
        description: 'Raw HuggingFace JSON URL'
        required: true
        default: 'https://huggingface.co/micahchoo/piper-kn/resolve/main/kn_IN-syspin_male-medium.onnx.json'
      text_to_speak:
        description: 'Text to generate audio for'
        required: true
        default: 'ಒಂದು ಹಳ್ಳಿಯಲ್ಲಿ ರಾಮು ಎಂಬ ಹುಡುಗ ವಾಸಿಸುತ್ತಿದ್ದನು.'

jobs:
  generate-and-play:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install System Dependencies (Fixes Core Dump)
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng

      - name: Download Piper TTS Engine
        run: |
          wget -q https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz
          tar -xzf piper_linux_x86_64.tar.gz
          chmod +x piper/piper

      - name: Download Model Files
        run: |
          echo "Downloading ONNX model..."
          wget -q -O model.onnx "${{ github.event.inputs.model_onnx_url }}"
          
          echo "Downloading JSON config..."
          wget -q -O model.onnx.json "${{ github.event.inputs.model_json_url }}"
          
          echo "✅ Download successful! File sizes:"
          ls -lh model.onnx*

      - name: Generate Audio (.wav)
        run: |
          mkdir -p audio_samples
          FILENAME="audio_samples/sample_${{ github.run_id }}.wav"
          
          echo "Generating audio..."
          
          # CRITICAL FIX: Explicitly point to the espeak-ng data folder to prevent core dumps
          echo "${{ github.event.inputs.text_to_speak }}" | ./piper/piper \
            --model model.onnx \
            --espeak_data ./piper/espeak-ng-data \
            --output_file "$FILENAME"
          
          echo "AUDIO_FILE=$FILENAME" >> $GITHUB_ENV

      - name: Commit Audio to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add ${{ env.AUDIO_FILE }}
          git commit -m "chore: add generated TTS audio sample [skip ci]" || echo "No changes to commit"
          git push

      - name: 🎧 Output Playable Browser Link
        run: |
          RAW_URL="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/${{ env.AUDIO_FILE }}"
          
          echo "## 🎧 Click the link below to play the audio directly in your browser:" >> $GITHUB_STEP_SUMMARY
          echo "### 🔊 [PLAY AUDIO NOW]($RAW_URL)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "*(💡 Tip: Right-click and 'Open in new tab' if it downloads instead of playing)*" >> $GITHUB_STEP_SUMMARY