name: Universal TTS Model Tester

on:
  workflow_dispatch:
    inputs:
      model_type:
        description: 'TTS model architecture'
        required: true
        type: choice
        options:
          - vits
          - matcha
          - kokoro
          - piper
        default: vits
      model_url:
        description: 'Main model file URL (model.onnx, or acoustic model for matcha) — MUST contain /resolve/main/'
        required: true
        default: 'https://huggingface.co/sriram09764/itantra-tts-onnx/resolve/main/gu/model.onnx'
      config_url:
        description: '(piper only) .onnx.json config URL — MUST contain /resolve/main/'
        required: false
        default: ''
      tokens_url:
        description: 'tokens.txt URL (not used for piper) — MUST contain /resolve/main/'
        required: false
        default: 'https://huggingface.co/sriram09764/itantra-tts-onnx/resolve/main/gu/tokens.txt'
      vocoder_url:
        description: '(matcha only) vocoder .onnx URL'
        required: false
        default: ''
      voices_url:
        description: '(kokoro only) voices.bin URL'
        required: false
        default: ''
      lexicon_url:
        description: '(optional, some languages e.g. Mandarin) lexicon.txt URL'
        required: false
        default: ''
      speaker_id:
        description: 'Speaker ID (multi-speaker models)'
        required: false
        default: '0'
      speed:
        description: 'Speech speed (1.0 = normal)'
        required: false
        default: '1.0'

jobs:
  tts-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify input text file exists
        run: |
          if [ ! -f "tts_input.txt" ]; then
            echo "❌ tts_input.txt not found at repo root."
            exit 1
          fi
          if [ ! -s "tts_input.txt" ]; then
            echo "❌ tts_input.txt is empty."
            exit 1
          fi
          echo "✅ Found tts_input.txt ($(wc -c < tts_input.txt) bytes)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install sherpa-onnx soundfile numpy

      - name: Download model files
        env:
          MODEL_URL: ${{ inputs.model_url }}
          TOKENS_URL: ${{ inputs.tokens_url }}
          VOCODER_URL: ${{ inputs.vocoder_url }}
          VOICES_URL: ${{ inputs.voices_url }}
          LEXICON_URL: ${{ inputs.lexicon_url }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CONFIG_URL: ${{ inputs.config_url }}
          MODEL_TYPE: ${{ inputs.model_type }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "WARNING: HF_TOKEN is EMPTY - the secret is missing, misnamed, or not a repository secret of this repo."
          else
            echo "HF_TOKEN is set (${#HF_TOKEN} characters)."
            who=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $HF_TOKEN" https://huggingface.co/api/whoami-v2)
            echo "Token check with Hugging Face: HTTP $who (200 = valid token, 401 = invalid token)."
          fi

          fetch() {
            local url="$1" out="$2"
            if [ -z "$url" ]; then return 0; fi
            echo "Downloading $out ..."
            if [ -n "$HF_TOKEN" ]; then
              http_code=$(curl -L -sS -o "$out" -w "%{http_code}" -H "Authorization: Bearer $HF_TOKEN" "$url")
            else
              http_code=$(curl -L -sS -o "$out" -w "%{http_code}" "$url")
            fi
            if [ "$http_code" -ge 400 ]; then
              echo "❌ $out failed to download (HTTP $http_code)."
              echo "   401 = token missing or invalid. 403 = token valid but no access: accept the model terms with the SAME Hugging Face account, and if the token is fine-grained, enable read access to public gated repos."
              rm -f "$out"
              exit 1
            fi
            if [ ! -s "$out" ]; then
              echo "❌ $out downloaded empty."
              exit 1
            fi
            if head -c 200 "$out" | grep -qi "<!doctype html\|<html"; then
              echo "❌ $out looks like an HTML page, not the real file."
              exit 1
            fi
          }

          fetch "$MODEL_URL" model.onnx
          if [ "$MODEL_TYPE" = "piper" ]; then
            if [ -z "$CONFIG_URL" ]; then
              echo "❌ piper model_type needs config_url (the .onnx.json file)."
              exit 1
            fi
            fetch "$CONFIG_URL" model.onnx.json
          else
            fetch "$TOKENS_URL" tokens.txt
            fetch "$VOCODER_URL" vocoder.onnx
            fetch "$VOICES_URL" voices.bin
            fetch "$LEXICON_URL" lexicon.txt
          fi

          echo "✅ Downloaded files:"
          ls -lh *.onnx *.txt *.bin 2>/dev/null || true

      - name: Sanitize token/lexicon files
        run: |
          for f in tokens.txt lexicon.txt; do
            if [ -f "$f" ]; then
              sed -i 's/\r$//' "$f"
            fi
          done

      - name: Inspect ONNX model (isolated install)
        continue-on-error: true
        run: |
          pip install --quiet --target /tmp/onnxlib onnx onnxruntime
          PYTHONPATH=/tmp/onnxlib python3 - << 'PYEOF'
          import onnx
          m = onnx.load("model.onnx")
          init = {x.name for x in m.graph.initializer}

          def shape_of(t):
              return [d.dim_value if d.dim_value else d.dim_param for d in t.type.tensor_type.shape.dim]

          print("Inputs:")
          for i in m.graph.input:
              if i.name not in init:
                  print(f"  name={i.name!r} shape={shape_of(i)}")
          print("Outputs:")
          for o in m.graph.output:
              print(f"  name={o.name!r} shape={shape_of(o)}")
          print("Metadata:")
          for p in m.metadata_props:
              print(f"  {p.key} = {p.value[:80]!r}")
          PYEOF

      - name: Generate Audio (.wav)
        env:
          MODEL_TYPE: ${{ inputs.model_type }}
          SPEAKER_ID: ${{ inputs.speaker_id }}
          SPEED: ${{ inputs.speed }}
        run: |
          if [ "$MODEL_TYPE" = "piper" ]; then
            pip install --quiet piper-tts
            cat << 'PIPEREOF' > piper_tts.py
          import os
          import subprocess
          import sys
          import wave
          from piper import PiperVoice
          import json


          def patch_config(path):
              with open(path, encoding="utf-8") as f:
                  cfg = json.load(f)
              print("config keys:", sorted(cfg.keys()), flush=True)
              ids = []
              for v in cfg.get("phoneme_id_map", {}).values():
                  ids.extend(v if isinstance(v, list) else [v])
              added = []
              if "num_symbols" not in cfg:
                  cfg["num_symbols"] = (max(ids) + 1) if ids else 256
                  added.append("num_symbols")
              if "num_speakers" not in cfg:
                  cfg["num_speakers"] = 1
                  added.append("num_speakers")
              if "sample_rate" not in cfg.setdefault("audio", {}):
                  cfg["audio"]["sample_rate"] = 22050
                  added.append("audio.sample_rate")
              if not cfg.setdefault("espeak", {}).get("voice"):
                  cfg["espeak"]["voice"] = "gu"
                  added.append("espeak.voice")
              if added:
                  print("config was missing, filled in:", added, flush=True)
                  with open(path, "w", encoding="utf-8") as f:
                      json.dump(cfg, f, ensure_ascii=False)


          patch_config("model.onnx.json")

          text = open("tts_input.txt", encoding="utf-8").read().strip()
          speaker_id = int(os.environ.get("SPEAKER_ID", "0") or "0")
          speed = float(os.environ.get("SPEED", "1.0") or "1.0")

          os.makedirs("audio_samples", exist_ok=True)
          filename = f"audio_samples/sample_{os.environ['GITHUB_RUN_ID']}.wav"
          print(f"piper mode: {len(text)} chars, speaker_id={speaker_id}, speed={speed}", flush=True)

          def via_api():
              try:
                  from piper import SynthesisConfig
              except ImportError:
                  SynthesisConfig = None
              voice = PiperVoice.load("model.onnx", config_path="model.onnx.json")
              with wave.open(filename, "wb") as wf:
                  if SynthesisConfig is not None:
                      multi = getattr(voice.config, "num_speakers", 1) > 1
                      syn = SynthesisConfig(length_scale=1.0 / speed, speaker_id=speaker_id if multi else None)
                      voice.synthesize_wav(text, wf, syn_config=syn)
                  else:
                      voice.synthesize(text, wf, length_scale=1.0 / speed)

          try:
              via_api()
          except Exception as e:
              print(f"Python API failed ({e!r}); trying the piper CLI.", flush=True)
              subprocess.run(
                  [sys.executable, "-m", "piper", "-m", "model.onnx", "-c", "model.onnx.json", "-f", filename],
                  input=text.encode("utf-8"),
                  check=True,
              )

          if os.path.getsize(filename) < 1000:
              sys.exit("No audio produced.")
          print(f"✅ Saved to {filename}", flush=True)

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"AUDIO_FILE={filename}\n")
          PIPEREOF
            python -u piper_tts.py
            exit 0
          fi

          cat << 'PYEOF' > generate_tts.py
          import os
          import re
          import sys
          import numpy as np
          import sherpa_onnx
          import soundfile as sf

          attempt = sys.argv[1]
          model_type = os.environ["MODEL_TYPE"]
          speaker_id = int(os.environ.get("SPEAKER_ID", "0") or "0")
          speed = float(os.environ.get("SPEED", "1.0") or "1.0")

          with open("tts_input.txt", encoding="utf-8") as f:
              raw_text = f.read().strip()

          print(f"[{attempt}] sherpa-onnx {getattr(sherpa_onnx, '__version__', '?')} | model_type={model_type} | text={len(raw_text)} chars", flush=True)

          lexicon = "lexicon.txt" if os.path.exists("lexicon.txt") else ""
          max_sentences = -1 if attempt == "raw_whole" else 1

          if model_type == "vits":
              model_cfg = sherpa_onnx.OfflineTtsModelConfig(
                  vits=sherpa_onnx.OfflineTtsVitsModelConfig(
                      model="model.onnx", tokens="tokens.txt", lexicon=lexicon,
                  ),
                  num_threads=1, debug=True,
              )
          elif model_type == "matcha":
              if not os.path.exists("vocoder.onnx"):
                  raise SystemExit("matcha model_type needs vocoder_url set.")
              model_cfg = sherpa_onnx.OfflineTtsModelConfig(
                  matcha=sherpa_onnx.OfflineTtsMatchaModelConfig(
                      acoustic_model="model.onnx", vocoder="vocoder.onnx",
                      tokens="tokens.txt", lexicon=lexicon,
                  ),
                  num_threads=1, debug=True,
              )
          elif model_type == "kokoro":
              if not os.path.exists("voices.bin"):
                  raise SystemExit("kokoro model_type needs voices_url set.")
              model_cfg = sherpa_onnx.OfflineTtsModelConfig(
                  kokoro=sherpa_onnx.OfflineTtsKokoroModelConfig(
                      model="model.onnx", voices="voices.bin",
                      tokens="tokens.txt", lexicon=lexicon,
                  ),
                  num_threads=1, debug=True,
              )
          else:
              raise SystemExit(f"Unknown model_type: {model_type}")

          def load_allowed():
              allowed = set()
              with open("tokens.txt", encoding="utf-8") as f:
                  for line in f:
                      line = line.rstrip("\n")
                      if not line:
                          continue
                      tok = line.rsplit(" ", 1)[0] if " " in line else line
                      if tok == "":
                          tok = " "
                      if len(tok) != 1:
                          return None
                      allowed.add(tok)
              return allowed

          def clean(s, allowed):
              if allowed is None:
                  return s.strip()
              s = "".join(ch if (ch in allowed or ch.isspace()) else " " for ch in s)
              return re.sub(r"\s+", " ", s).strip()

          allowed = load_allowed()
          print(f"[{attempt}] token chars known: {len(allowed) if allowed else 'n/a (not a char-level model)'}", flush=True)

          if attempt == "clean_per_sentence":
              texts = [clean(p, allowed) for p in re.split(r"[.!?।؟\n]+", raw_text)]
              texts = [t for t in texts if t]
          elif attempt == "clean_whole":
              texts = [clean(raw_text, allowed)]
          else:
              texts = [raw_text]

          config = sherpa_onnx.OfflineTtsConfig(model=model_cfg, max_num_sentences=max_sentences)
          tts = sherpa_onnx.OfflineTts(config)
          print(f"[{attempt}] model loaded, sample_rate={tts.sample_rate}", flush=True)

          chunks, sr = [], None
          for i, t in enumerate(texts, 1):
              print(f"[{attempt}] synthesizing {i}/{len(texts)}: {t[:50]!r}", flush=True)
              audio = tts.generate(t, sid=speaker_id, speed=speed)
              if len(audio.samples) == 0:
                  print("  (empty audio, skipped)", flush=True)
                  continue
              sr = audio.sample_rate
              if chunks:
                  chunks.append(np.zeros(int(sr * 0.25), dtype=np.float32))
              chunks.append(np.asarray(audio.samples, dtype=np.float32))

          if not chunks:
              sys.exit("No audio produced.")

          os.makedirs("audio_samples", exist_ok=True)
          filename = f"audio_samples/sample_{os.environ['GITHUB_RUN_ID']}.wav"
          sf.write(filename, np.concatenate(chunks), sr)
          print(f"✅ Saved to {filename}", flush=True)

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"AUDIO_FILE={filename}\n")
          PYEOF

          cat << 'DIREOF' > direct_tts.py
          import os
          import re
          import unicodedata
          import wave
          import numpy as np
          import onnxruntime as ort

          with open("tts_input.txt", encoding="utf-8") as f:
              raw_text = f.read().strip()
          raw_text = unicodedata.normalize("NFC", raw_text)

          dropped = {}
          vocab = {}
          with open("tokens.txt", encoding="utf-8") as f:
              for line in f:
                  line = line.rstrip("\n")
                  if not line:
                      continue
                  tok, _, idx = line.rpartition(" ")
                  vocab[tok if tok != "" else " "] = int(idx)

          sess = ort.InferenceSession("model.onnx", providers=["CPUExecutionProvider"])
          meta = sess.get_modelmeta().custom_metadata_map
          add_blank = meta.get("add_blank", "1") == "1"
          sr = int(meta.get("sample_rate", "16000"))
          blank = vocab.get("_", 0)
          in_name = sess.get_inputs()[0].name
          print(f"direct mode: sample_rate={sr} add_blank={add_blank} vocab={len(vocab)}", flush=True)

          def pieces(text):
              out = []
              for sent in re.split(r"(?<=[.!?।؟])\s+|\n+", text):
                  sent = sent.strip()
                  if not sent:
                      continue
                  clauses = [c.strip() for c in re.split(r"[,;:()\u2014\u2013]+", sent)]
                  clauses = [c for c in clauses if c]
                  for k, clause in enumerate(clauses):
                      last_clause = k == len(clauses) - 1
                      while len(clause) > 70:
                          cut = clause.rfind(" ", 0, 70)
                          cut = cut if cut > 0 else 70
                          out.append((clause[:cut].strip(), 0.05))
                          clause = clause[cut:].strip()
                      if clause:
                          out.append((clause, 0.45 if last_clause else 0.2))
              return out

          def encode(chunk):
              ids = []
              for ch in chunk:
                  if ch in vocab:
                      ids.append(vocab[ch])
                  elif ch.lower() in vocab:
                      ids.append(vocab[ch.lower()])
                  elif not ch.isspace():
                      dropped[ch] = dropped.get(ch, 0) + 1
              if add_blank:
                  spaced = [blank]
                  for i in ids:
                      spaced += [i, blank]
                  ids = spaced
              return ids

          parts = []
          for n, (chunk, pause) in enumerate(pieces(raw_text), 1):
              ids = encode(chunk)
              if len(ids) < 3:
                  continue
              print(f"synthesizing {n}: {chunk[:50]!r} ({len(ids)} tokens)", flush=True)
              wav = sess.run(None, {in_name: np.array([ids], dtype=np.int64)})[0].reshape(-1)
              parts.append(wav.astype(np.float32))
              parts.append(np.zeros(int(sr * pause), dtype=np.float32))

          if dropped:
              print("⚠️ Characters not in tokens.txt (silently dropped):", flush=True)
              for ch, cnt in sorted(dropped.items(), key=lambda kv: -kv[1])[:30]:
                  print(f"   {ch!r} U+{ord(ch):04X} x{cnt}", flush=True)
          else:
              print("✅ Every character was found in tokens.txt.", flush=True)

          if not parts:
              raise SystemExit("No audio produced - none of the text characters are in tokens.txt.")

          audio = np.concatenate(parts)
          peak = float(np.max(np.abs(audio)))
          if peak > 1.0:
              audio = audio / peak
          pcm = (np.clip(audio, -1.0, 1.0) * 32767).astype(np.int16)

          os.makedirs("audio_samples", exist_ok=True)
          filename = f"audio_samples/sample_{os.environ['GITHUB_RUN_ID']}.wav"
          with wave.open(filename, "wb") as w:
              w.setnchannels(1)
              w.setsampwidth(2)
              w.setframerate(sr)
              w.writeframes(pcm.tobytes())
          print(f"✅ Saved to {filename}", flush=True)

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"AUDIO_FILE={filename}\n")
          DIREOF

          MODEL_INPUTS=$(PYTHONPATH=/tmp/onnxlib python3 -c "import onnxruntime as ort; print(','.join(i.name for i in ort.InferenceSession('model.onnx', providers=['CPUExecutionProvider']).get_inputs()))")
          echo "Model inputs: $MODEL_INPUTS"
          if [ "$MODEL_INPUTS" = "x" ]; then
            echo "Single-input export detected (not the sherpa-onnx layout) - using ONNX Runtime directly."
            PYTHONPATH=/tmp/onnxlib python -u direct_tts.py
            exit 0
          fi

          for attempt in clean_per_sentence clean_whole raw_whole; do
            echo "=== Attempt: $attempt ==="
            if python -u generate_tts.py "$attempt"; then
              exit 0
            else
              echo "⚠️ Attempt $attempt failed with exit code $? (139 = segfault, 1 = Python error)"
            fi
          done
          echo "❌ All attempts failed. Model details for debugging:"
          pip install --quiet --target /tmp/onnxlib onnx onnxruntime 2>/dev/null || true
          PYTHONPATH=/tmp/onnxlib python3 - << 'INSPECTEOF'
          import onnx
          m = onnx.load("model.onnx")
          init = {x.name for x in m.graph.initializer}

          def shape_of(t):
              return [d.dim_value if d.dim_value else d.dim_param for d in t.type.tensor_type.shape.dim]

          print("MODEL INPUTS:")
          for i in m.graph.input:
              if i.name not in init:
                  print(f"  name={i.name!r} shape={shape_of(i)}")
          print("MODEL OUTPUTS:")
          for o in m.graph.output:
              print(f"  name={o.name!r} shape={shape_of(o)}")
          print("MODEL METADATA:")
          for p in m.metadata_props:
              print(f"  {p.key} = {p.value[:60]!r}")
          INSPECTEOF
          exit 1

      - name: Build browser player page
        run: |
          python3 - << 'HTMLEOF'
          import base64, html, os
          wav = os.environ["AUDIO_FILE"]
          text = open("tts_input.txt", encoding="utf-8").read()
          b64 = base64.b64encode(open(wav, "rb").read()).decode()
          page = (
              '<!doctype html><html><head><meta charset="utf-8">'
              '<meta name="viewport" content="width=device-width, initial-scale=1">'
              '<title>TTS sample</title></head>'
              '<body style="font-family:sans-serif;max-width:700px;margin:20px auto;padding:0 12px">'
              '<h2>TTS sample</h2>'
              '<audio controls style="width:100%" src="data:audio/wav;base64,' + b64 + '"></audio>'
              '<p style="white-space:pre-wrap">' + html.escape(text) + '</p>'
              '</body></html>'
          )
          out = wav[:-4] + ".html"
          open(out, "w", encoding="utf-8").write(page)
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"PLAYER_FILE={out}\n")
          print("Built", out)
          HTMLEOF

      - name: Commit Audio to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ env.AUDIO_FILE }}" "${{ env.PLAYER_FILE }}"
          git commit -m "chore: TTS test sample [skip ci]" || echo "No changes to commit"
          git push

      - name: 🎧 Output Playable Browser Link
        run: |
          PLAY_URL="https://raw.githack.com/${{ github.repository }}/${{ github.ref_name }}/${{ env.PLAYER_FILE }}"
          {
            echo "## 🎧 Your TTS sample is ready"
            echo "### 🔊 [PLAY IN BROWSER]($PLAY_URL)"
            echo ""
            echo "File in repo: ${{ env.AUDIO_FILE }}"
            echo ""
            echo "**Text used (from tts_input.txt):**"
            echo '```'
            cat tts_input.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"