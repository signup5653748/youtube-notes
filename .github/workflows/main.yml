name: Generate TTS Audio Samples

# This allows you to run the workflow manually from the "Actions" tab
on:
  workflow_dispatch:
    inputs:
      hf_model_url:
        description: 'HuggingFace Model URL (e.g., https://huggingface.co/rhasspy/piper-voices/resolve/main/hi/hi_IN/priyamvada/medium/hi_IN-priyamvada-medium.onnx)'
        required: true
        default: 'https://huggingface.co/rhasspy/piper-voices/resolve/main/hi/hi_IN/priyamvada/medium/hi_IN-priyamvada-medium.onnx'
      text_to_speak:
        description: 'Text to generate audio for'
        required: true
        default: 'नमस्ते, मैं हिंदी बोल रहा हूँ।'

jobs:
  generate-audio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Download Piper TTS Engine
        run: |
          wget https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz
          tar -xzf piper_linux_x86_64.tar.gz
          chmod +x piper/piper

      - name: Download ONNX Model and JSON from HuggingFace
        run: |
          # Download the .onnx file
          wget -O model.onnx "${{ github.event.inputs.hf_model_url }}"
          
          # Download the .json config file (assuming it has the same name + .json)
          wget -O model.onnx.json "${{ github.event.inputs.hf_model_url }}.json"

      - name: Generate Audio (.wav)
        run: |
          echo "${{ github.event.inputs.text_to_speak }}" | ./piper/piper --model model.onnx --output_file generated_sample.wav

      - name: Upload Audio Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tts-audio-sample
          path: generated_sample.wav
