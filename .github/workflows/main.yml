name: Generate TTS Audio Samples

on:
  workflow_dispatch:
    inputs:
      text_to_speak:
        description: 'Text to generate audio for (Hindi)'
        required: true
        default: 'नमस्ते, मैं हिंदी बोल रहा हूँ।'

jobs:
  generate-audio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Download Piper TTS Engine
        run: |
          wget -q https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz
          tar -xzf piper_linux_x86_64.tar.gz
          chmod +x piper/piper

      - name: Download ONNX Model and JSON (CORRECT LINKS)
        run: |
          # Download the .onnx file using 'resolve/main'
          wget -q -O model.onnx "https://huggingface.co/rhasspy/piper-voices/resolve/main/hi/hi_IN/priyamvada/medium/hi_IN-priyamvada-medium.onnx"
          
          # Download the .json config file using 'resolve/main'
          wget -q -O model.onnx.json "https://huggingface.co/rhasspy/piper-voices/resolve/main/hi/hi_IN/priyamvada/medium/hi_IN-priyamvada-medium.onnx.json"
          
          echo "Files downloaded successfully:"
          ls -lh

      - name: Generate Audio (.wav)
        run: |
          echo "${{ github.event.inputs.text_to_speak }}" | ./piper/piper --model model.onnx --output_file generated_sample.wav

      - name: Upload Audio Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hindi-tts-audio-sample
          path: generated_sample.wav