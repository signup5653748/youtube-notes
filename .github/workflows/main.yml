name: Generate and Play TTS Audio (MMS Kannada)

on:
  workflow_dispatch:
    inputs:
      text_to_speak:
        description: 'Kannada Text to generate audio for'
        required: true
        default: 'ಒಂದು ಹಳ್ಳಿಯಲ್ಲಿ ರಾಮು ಎಂಬ ಹುಡುಗ ವಾಸಿಸುತ್ತಿದ್ದನು. ಅವನು ತುಂಬಾ ಒಳ್ಳೆಯ ಮನಸ್ಸಿನವನಾಗಿದ್ದನು.'

jobs:
  generate-and-play:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install sherpa-onnx soundfile

      - name: Download MMS Kannada Model
        run: |
          echo "Downloading verified MMS Kannada model..."
          wget -q -O model.onnx "https://huggingface.co/csukuangfj/vits-mms-tts-kan/resolve/main/model.onnx"
          wget -q -O tokens.txt "https://huggingface.co/csukuangfj/vits-mms-tts-kan/resolve/main/tokens.txt"
          echo "✅ Download successful!"
          ls -lh model.onnx tokens.txt

      - name: Generate Audio (.wav)
        run: |
          cat << 'EOF' > generate_tts.py
          import sherpa_onnx
          import soundfile as sf
          import os

          text = """${{ github.event.inputs.text_to_speak }}"""
          print(f"Generating audio for: {text}")

          # Configure the MMS TTS model (No espeak-ng needed!)
          config = sherpa_onnx.OfflineTtsConfig(
              model=sherpa_onnx.OfflineTtsModelConfig(
                  vits=sherpa_onnx.OfflineTtsVitsModelConfig(
                      model="model.onnx",
                      tokens="tokens.txt",
                      length_scale=1.0,
                  ),
                  num_threads=1,
                  debug=False,
              ),
              max_num_sentences=1,
          )
          
          # Create engine and generate
          tts = sherpa_onnx.OfflineTts(config)
          audio = tts.generate(text, sid=0, speed=1.0)
          
          # Save file
          os.makedirs("audio_samples", exist_ok=True)
          filename = f"audio_samples/sample_{os.environ['GITHUB_RUN_ID']}.wav"
          sf.write(filename, audio.samples, audio.sample_rate)
          print(f"✅ Saved to {filename}")
          
          # Pass filename to next step
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f"AUDIO_FILE={filename}\n")
          EOF
          
          python generate_tts.py

      - name: Commit Audio to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ env.AUDIO_FILE }}
          git commit -m "chore: add generated TTS audio sample [skip ci]"