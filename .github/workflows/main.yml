name: Universal TTS Model Tester

on:
  workflow_dispatch:
    inputs:
      model_type:
        description: 'TTS model architecture'
        required: true
        type: choice
        options:
          - vits
          - matcha
          - kokoro
        default: vits
      model_url:
        description: 'Main model file URL (model.onnx, or acoustic model for matcha) — MUST contain /resolve/main/'
        required: true
        default: 'https://huggingface.co/sriram09764/itantra-tts-onnx/resolve/main/gu/model.onnx'
      tokens_url:
        description: 'tokens.txt URL — MUST contain /resolve/main/'
        required: true
        default: 'https://huggingface.co/sriram09764/itantra-tts-onnx/resolve/main/gu/tokens.txt'
      vocoder_url:
        description: '(matcha only) vocoder .onnx URL'
        required: false
        default: ''
      voices_url:
        description: '(kokoro only) voices.bin URL'
        required: false
        default: ''
      lexicon_url:
        description: '(optional, some languages e.g. Mandarin) lexicon.txt URL'
        required: false
        default: ''
      speaker_id:
        description: 'Speaker ID (multi-speaker models)'
        required: false
        default: '0'
      speed:
        description: 'Speech speed (1.0 = normal)'
        required: false
        default: '1.0'

jobs:
  tts-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify input text file exists
        run: |
          if [ ! -f "tts_input.txt" ]; then
            echo "❌ tts_input.txt not found at repo root."
            exit 1
          fi
          if [ ! -s "tts_input.txt" ]; then
            echo "❌ tts_input.txt is empty."
            exit 1
          fi
          echo "✅ Found tts_input.txt ($(wc -c < tts_input.txt) bytes)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install sherpa-onnx soundfile numpy

      - name: Download model files
        env:
          MODEL_URL: ${{ inputs.model_url }}
          TOKENS_URL: ${{ inputs.tokens_url }}
          VOCODER_URL: ${{ inputs.vocoder_url }}
          VOICES_URL: ${{ inputs.voices_url }}
          LEXICON_URL: ${{ inputs.lexicon_url }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          fetch() {
            local url="$1" out="$2"
            if [ -z "$url" ]; then return 0; fi
            echo "Downloading $out ..."
            if [ -n "$HF_TOKEN" ]; then
              http_code=$(curl -L -sS -o "$out" -w "%{http_code}" -H "Authorization: Bearer $HF_TOKEN" "$url")
            else
              http_code=$(curl -L -sS -o "$out" -w "%{http_code}" "$url")
            fi
            if [ "$http_code" -ge 400 ]; then
              echo "❌ $out failed to download (HTTP $http_code)."
              rm -f "$out"
              exit 1
            fi
            if [ ! -s "$out" ]; then
              echo "❌ $out downloaded empty."
              exit 1
            fi
            if head -c 200 "$out" | grep -qi "<!doctype html\|<html"; then
              echo "❌ $out looks like an HTML page, not the real file."
              exit 1
            fi
          }

          fetch "$MODEL_URL" model.onnx
          fetch "$TOKENS_URL" tokens.txt
          fetch "$VOCODER_URL" vocoder.onnx
          fetch "$VOICES_URL" voices.bin
          fetch "$LEXICON_URL" lexicon.txt

          echo "✅ Downloaded files:"
          ls -lh *.onnx *.txt *.bin 2>/dev/null || true

      - name: Sanitize token/lexicon files
        run: |
          for f in tokens.txt lexicon.txt; do
            if [ -f "$f" ]; then
              sed -i 's/\r$//' "$f"
            fi
          done

      - name: Inspect ONNX model (isolated install)
        continue-on-error: true
        run: |
          pip install --quiet --target /tmp/onnxlib onnx
          PYTHONPATH=/tmp/onnxlib python3 - << 'PYEOF'
          import onnx
          m = onnx.load("model.onnx")
          init = {x.name for x in m.graph.initializer}

          def shape_of(t):
              return [d.dim_value if d.dim_value else d.dim_param for d in t.type.tensor_type.shape.dim]

          print("Inputs:")
          for i in m.graph.input:
              if i.name not in init:
                  print(f"  name={i.name!r} shape={shape_of(i)}")
          print("Outputs:")
          for o in m.graph.output:
              print(f"  name={o.name!r} shape={shape_of(o)}")
          print("Metadata:")
          for p in m.metadata_props:
              print(f"  {p.key} = {p.value[:80]!r}")
          PYEOF

      - name: Generate Audio (.wav)
        env:
          MODEL_TYPE: ${{ inputs.model_type }}
          SPEAKER_ID: ${{ inputs.speaker_id }}
          SPEED: ${{ inputs.speed }}
        run: |
          cat << 'PYEOF' > generate_tts.py
          import os
          import re
          import sys
          import numpy as np
          import sherpa_onnx
          import soundfile as sf

          attempt = sys.argv[1]
          model_type = os.environ["MODEL_TYPE"]
          speaker_id = int(os.environ.get("SPEAKER_ID", "0") or "0")
          speed = float(os.environ.get("SPEED", "1.0") or "1.0")

          with open("tts_input.txt", encoding="utf-8") as f:
              raw_text = f.read().strip()

          print(f"[{attempt}] sherpa-onnx {getattr(sherpa_onnx, '__version__', '?')} | model_type={model_type} | text={len(raw_text)} chars", flush=True)

          lexicon = "lexicon.txt" if os.path.exists("lexicon.txt") else ""
          max_sentences = -1 if attempt == "raw_whole" else 1

          if model_type == "vits":
              model_cfg = sherpa_onnx.OfflineTtsModelConfig(
                  vits=sherpa_onnx.OfflineTtsVitsModelConfig(
                      model="model.onnx", tokens="tokens.txt", lexicon=lexicon,
                  ),
                  num_threads=1, debug=True,
              )
          elif model_type == "matcha":
              if not os.path.exists("vocoder.onnx"):
                  raise SystemExit("matcha model_type needs vocoder_url set.")
              model_cfg = sherpa_onnx.OfflineTtsModelConfig(
                  matcha=sherpa_onnx.OfflineTtsMatchaModelConfig(
                      acoustic_model="model.onnx", vocoder="vocoder.onnx",
                      tokens="tokens.txt", lexicon=lexicon,
                  ),
                  num_threads=1, debug=True,
              )
          elif model_type == "kokoro":
              if not os.path.exists("voices.bin"):
                  raise SystemExit("kokoro model_type needs voices_url set.")
              model_cfg = sherpa_onnx.OfflineTtsModelConfig(
                  kokoro=sherpa_onnx.OfflineTtsKokoroModelConfig(
                      model="model.onnx", voices="voices.bin",
                      tokens="tokens.txt", lexicon=lexicon,
                  ),
                  num_threads=1, debug=True,
              )
          else:
              raise SystemExit(f"Unknown model_type: {model_type}")

          def load_allowed():
              allowed = set()
              with open("tokens.txt", encoding="utf-8") as f:
                  for line in f:
                      line = line.rstrip("\n")
                      if not line:
                          continue
                      tok = line.rsplit(" ", 1)[0] if " " in line else line
                      if tok == "":
                          tok = " "
                      if len(tok) != 1:
                          return None
                      allowed.add(tok)
              return allowed

          def clean(s, allowed):
              if allowed is None:
                  return s.strip()
              s = "".join(ch if (ch in allowed or ch.isspace()) else " " for ch in s)
              return re.sub(r"\s+", " ", s).strip()

          allowed = load_allowed()
          print(f"[{attempt}] token chars known: {len(allowed) if allowed else 'n/a (not a char-level model)'}", flush=True)

          if attempt == "clean_per_sentence":
              texts = [clean(p, allowed) for p in re.split(r"[.!?।؟\n]+", raw_text)]
              texts = [t for t in texts if t]
          elif attempt == "clean_whole":
              texts = [clean(raw_text, allowed)]
          else:
              texts = [raw_text]

          config = sherpa_onnx.OfflineTtsConfig(model=model_cfg, max_num_sentences=max_sentences)
          tts = sherpa_onnx.OfflineTts(config)
          print(f"[{attempt}] model loaded, sample_rate={tts.sample_rate}", flush=True)

          chunks, sr = [], None
          for i, t in enumerate(texts, 1):
              print(f"[{attempt}] synthesizing {i}/{len(texts)}: {t[:50]!r}", flush=True)
              audio = tts.generate(t, sid=speaker_id, speed=speed)
              if len(audio.samples) == 0:
                  print("  (empty audio, skipped)", flush=True)
                  continue
              sr = audio.sample_rate
              if chunks:
                  chunks.append(np.zeros(int(sr * 0.25), dtype=np.float32))
              chunks.append(np.asarray(audio.samples, dtype=np.float32))

          if not chunks:
              sys.exit("No audio produced.")

          os.makedirs("audio_samples", exist_ok=True)
          filename = f"audio_samples/sample_{os.environ['GITHUB_RUN_ID']}.wav"
          sf.write(filename, np.concatenate(chunks), sr)
          print(f"✅ Saved to {filename}", flush=True)

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"AUDIO_FILE={filename}\n")
          PYEOF

          for attempt in clean_per_sentence clean_whole raw_whole; do
            echo "=== Attempt: $attempt ==="
            if python -u generate_tts.py "$attempt"; then
              exit 0
            else
              echo "⚠️ Attempt $attempt failed with exit code $? (139 = segfault, 1 = Python error)"
            fi
          done
          echo "❌ All attempts failed. Model details for debugging:"
          pip install --quiet --target /tmp/onnxlib onnx
          PYTHONPATH=/tmp/onnxlib python3 - << 'INSPECTEOF'
          import onnx
          m = onnx.load("model.onnx")
          init = {x.name for x in m.graph.initializer}

          def shape_of(t):
              return [d.dim_value if d.dim_value else d.dim_param for d in t.type.tensor_type.shape.dim]

          print("MODEL INPUTS:")
          for i in m.graph.input:
              if i.name not in init:
                  print(f"  name={i.name!r} shape={shape_of(i)}")
          print("MODEL OUTPUTS:")
          for o in m.graph.output:
              print(f"  name={o.name!r} shape={shape_of(o)}")
          print("MODEL METADATA:")
          for p in m.metadata_props:
              print(f"  {p.key} = {p.value[:60]!r}")
          INSPECTEOF
          exit 1

      - name: Commit Audio to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ env.AUDIO_FILE }}"
          git commit -m "chore: TTS test sample [skip ci]" || echo "No changes to commit"
          git push

      - name: 🎧 Output Playable Browser Link
        run: |
          RAW_URL="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/${{ env.AUDIO_FILE }}"
          {
            echo "## 🎧 Your TTS sample is ready"
            echo "### 🔊 [PLAY AUDIO NOW]($RAW_URL)"
            echo ""
            echo "**Text used (from tts_input.txt):**"
            echo '```'
            cat tts_input.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"