<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YT Player</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#000;height:100vh;overflow:hidden}
  #player{width:100%;height:100%}
  .err{color:#fff;font:14px sans-serif;padding:20px;text-align:center;display:none}
</style>
</head>
<body>
<div id="player"></div>
<div class="err" id="err">Loading failed. Try again.</div>
<script>
var videoId = new URLSearchParams(location.search).get('v');
if(!videoId || videoId.length !== 11){
  document.getElementById('err').style.display='block';
  throw new Error('Bad ID');
}

// KEY FIX: origin set to youtube.com so YouTube allows the embed
var tag = document.createElement('script');
tag.src = 'https://www.youtube.com/iframe_api';
document.head.appendChild(tag);

var player, tries = 0;

window.onYouTubeIframeAPIReady = function(){
  player = new YT.Player('player', {
    videoId: videoId,
    playerVars: {
      autoplay: 1,
      playsinline: 1,
      controls: 1,
      rel: 0,
      modestbranding: 1,
      origin: 'https://www.youtube.com'   // <-- THE FIX
    },
    events: {
      onReady: function(){
        notify('playerReady');
        setInterval(tick, 500);
      },
      onError: function(e){
        tries++;
        if(tries === 1) notify('playerError', 'Code: ' + e.data);
      }
    }
  });
};

function tick(){
  try{
    if(player && typeof player.getCurrentTime === 'function'){
      notify('timeUpdate', null, player.getCurrentTime(), player.getPlayerState());
    }
  }catch(e){}
}

function notify(type, msg, time, state){
  if(window.opener && !window.opener.closed){
    window.opener.postMessage({
      type: type, id: videoId,
      message: msg, time: time, state: state
    }, '*');
  }
}

window.addEventListener('message', function(e){
  if(!player || e.data.id !== videoId) return;
  if(e.data.type === 'seek') player.seekTo(e.data.time, true);
  if(e.data.type === 'play') player.playVideo();
  if(e.data.type === 'pause') player.pauseVideo();
});
</script>
</body>
</html>
