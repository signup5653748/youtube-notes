<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YouTube Video Notes</title>
<style>
  :root{
    --bg:#f6f6f8; --surface:#ffffff; --surface-2:#f0f0f2; --border:#e3e3e7;
    --text:#18181b; --text-muted:#71717a; --accent:#dc2626; --accent-text:#ffffff;
    --radius:12px;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#121214; --surface:#1c1c1f; --surface-2:#232327; --border:#2d2d31;
      --text:#f4f4f5; --text-muted:#a1a1aa; --accent:#ef4444; --accent-text:#ffffff;
    }
  }
  :root[data-theme="dark"]{
    --bg:#121214; --surface:#1c1c1f; --surface-2:#232327; --border:#2d2d31;
    --text:#f4f4f5; --text-muted:#a1a1aa; --accent:#ef4444; --accent-text:#ffffff;
  }
  html{ scroll-padding-top:env(safe-area-inset-top,0px); }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  .wrap{ max-width:720px; margin:0 auto; padding:16px 16px 100px; position:relative; min-height:100vh; }
  h1{ font-size:1.25rem; margin:0; }
  .header-row{ display:flex; justify-content:space-between; align-items:center; margin:4px 0 16px; gap:10px; }
  .icon-btn{
    background:none; border:1px solid var(--border); border-radius:8px; width:36px; height:36px;
    font-size:1.2rem; line-height:1; padding:0; display:flex; align-items:center; justify-content:center; flex:none;
  }
  .icon-btn.small{ width:26px; height:26px; font-size:1rem; border:none; background:var(--surface-2); }
  .menu-wrap{ position:relative; }
  .dropdown{
    position:absolute; right:0; top:calc(100% + 6px); background:var(--surface); border:1px solid var(--border);
    border-radius:8px; box-shadow:0 4px 14px rgba(0,0,0,.18); min-width:170px; z-index:30; overflow:hidden;
  }
  .dropdown button{ display:block; width:100%; text-align:left; border:none; background:none; border-radius:0; padding:10px 12px; font-size:0.88rem; }
  .dropdown button:hover{ background:var(--surface-2); }
  .note-menu-wrap{ position:relative; flex:none; }
  .note-dropdown{
    position:absolute; right:0; top:calc(100% + 4px); background:var(--surface); border:1px solid var(--border);
    border-radius:8px; box-shadow:0 4px 14px rgba(0,0,0,.18); min-width:120px; z-index:30; overflow:hidden;
  }
  .note-dropdown button{ display:block; width:100%; text-align:left; border:none; background:none; border-radius:0; padding:8px 10px; font-size:0.85rem; }
  .note-dropdown button:hover{ background:var(--surface-2); }
  button{ font:inherit; cursor:pointer; border:1px solid var(--border); background:var(--surface-2); color:var(--text); border-radius:8px; padding:10px 14px; }
  button.primary{ background:var(--accent); color:var(--accent-text); border-color:var(--accent); }
  button:active{ opacity:0.8; }
  button:disabled{ opacity:0.5; cursor:not-allowed; }
  input[type=text]{ flex:1; min-width:0; padding:10px 12px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:0.95rem; }
  textarea{ width:100%; min-height:60px; padding:10px 12px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--text); font:inherit; resize:vertical; margin-bottom:10px; }

  /* Home screen */
  .video-card{ display:flex; gap:12px; align-items:center; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:10px; margin-bottom:10px; cursor:pointer; }
  .video-thumb{ width:96px; height:54px; object-fit:cover; border-radius:8px; background:var(--surface-2); flex:none; }
  .video-info{ flex:1; min-width:0; }
  .video-title{ font-size:0.92rem; font-weight:600; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .video-count{ font-size:0.78rem; color:var(--text-muted); margin-top:2px; }
  .fab{
    position:fixed; right:20px; bottom:calc(20px + env(safe-area-inset-bottom,0px)); width:56px; height:56px;
    border-radius:50%; background:var(--accent); color:var(--accent-text); border:none; font-size:1.8rem;
    display:flex; align-items:center; justify-content:center; box-shadow:0 4px 14px rgba(0,0,0,.25); z-index:20;
  }
  .no-notes{ color:var(--text-muted); font-size:0.88rem; padding:6px 0; }

  /* Detail view */
  .detail-header{ display:flex; align-items:center; gap:10px; margin:4px 0 16px; }
  .detail-title{ flex:1; min-width:0; font-size:1.05rem; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .video-wrap{ position:relative; width:100%; padding-top:56.25%; background:#000; border-radius:var(--radius); overflow:hidden; margin:0 0 4px; }
  .video-wrap iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; }
  #player{ position:absolute; inset:0; width:100%; height:100%; }
  .status-row{ display:flex; justify-content:space-between; align-items:center; margin:6px 2px 16px; }
  .time-live{ font-size:0.82rem; color:var(--text-muted); font-variant-numeric:tabular-nums; }
  .api-status{ font-size:0.75rem; color:var(--text-muted); }
  .panel{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:20px; }
  .panel h2{ font-size:0.95rem; margin:0 0 10px; }
  .notes-header{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
  .notes-header h2{ margin:0; }
  .count{ color:var(--text-muted); font-size:0.85rem; }
  .note{ display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-top:1px solid var(--border); }
  .note:first-child{ border-top:none; }
  .note-time{ flex:none; background:var(--surface-2); border:1px solid var(--border); color:var(--text); border-radius:7px; padding:6px 9px; font-size:0.82rem; font-variant-numeric:tabular-nums; cursor:pointer; }
  .note-body{ flex:1; min-width:0; }
  .note-text{ white-space:pre-wrap; word-break:break-word; font-size:0.92rem; line-height:1.35; }
  .note-edit textarea{ margin-bottom:6px; min-height:50px; }

  /* Player mode indicator */
  .player-mode{
    display:inline-block; padding:2px 8px; border-radius:4px; font-size:0.7rem; 
    background:var(--surface-2); color:var(--text-muted); margin-left:8px;
  }
  .player-mode.popup{ background:#fef3c7; color:#92400e; }
  .player-mode.embed{ background:#d1fae5; color:#065f46; }

  /* Modals */
  .modal-overlay{ position:fixed; inset:0; background:rgba(0,0,0,.5); align-items:center; justify-content:center; padding:20px; z-index:50; display:flex; }
  .modal-overlay[hidden]{ display:none; }
  .modal-box{ background:var(--surface); border-radius:var(--radius); padding:16px; width:100%; max-width:440px; }
  .modal-box h2{ margin:0 0 10px; font-size:1rem; }
  .modal-actions{ display:flex; gap:8px; justify-content:flex-end; margin-top:10px; }
  #importTextarea{ min-height:130px; }
  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px); background:var(--text); color:var(--bg);
    padding:8px 14px; border-radius:8px; font-size:0.85rem; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:60;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .error-banner{
    background:#fef2f2; border:1px solid #fecaca; color:#991b1b;
    padding:10px 12px; border-radius:8px; margin-bottom:12px; font-size:0.85rem;
  }
  @media (prefers-color-scheme: dark){
    .error-banner{ background:#450a0a; border-color:#7f1d1d; color:#fecaca; }
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- HOME SCREEN -->
  <div id="homeView">
    <div class="header-row">
      <h1> YouTube Video Notes</h1>
    </div>
    <div id="videoList"></div>
  </div>
  <button class="fab" id="fabBtn" aria-label="Add video">＋</button>

  <!-- DETAIL VIEW -->
  <div id="detailView" hidden>
    <div class="detail-header">
      <button class="icon-btn" id="backBtn" aria-label="Back">←</button>
      <div class="detail-title" id="detailTitle">Video</div>
      <div class="menu-wrap" id="headerMenuWrap">
        <button class="icon-btn" id="headerMenuBtn" aria-label="More options"></button>
        <div class="dropdown" id="headerDropdown" hidden>
          <button id="popupBtn">🪟 Use popup player</button>
          <button id="copyBtn">📋 Copy notes</button>
          <button id="importBtn">📥 Import notes</button>
        </div>
      </div>
    </div>

    <div id="errorBanner" class="error-banner" hidden></div>
    <div class="video-wrap" id="videoWrap"></div>
    <div class="status-row">
      <span class="time-live" id="timeLive"></span>
      <span class="api-status" id="apiStatus">Loading player API…</span>
    </div>

    <div class="panel">
      <h2>Add a note</h2>
      <textarea id="noteText" placeholder="What's happening right now?"></textarea>
      <button class="primary" id="addBtn" disabled>➕ Add note at current time</button>
    </div>

    <div class="panel">
      <div class="notes-header">
        <h2>Notes</h2>
        <span class="count" id="noteCount"></span>
      </div>
      <div id="notesList"></div>
    </div>
  </div>
</div>

<!-- Add video modal -->
<div class="modal-overlay" id="addOverlay" hidden>
  <div class="modal-box">
    <h2>Add a video</h2>
    <input type="text" id="addUrlInput" placeholder="Paste a YouTube video URL…">
    <div class="modal-actions">
      <button id="addCancelBtn">Cancel</button>
      <button class="primary" id="addConfirmBtn">Add</button>
    </div>
  </div>
</div>

<!-- Import notes modal -->
<div class="modal-overlay" id="importOverlay" hidden>
  <div class="modal-box">
    <h2>Import notes</h2>
    <textarea id="importTextarea" placeholder="URL: https://youtu.be/...&#10;[1:23] Note text"></textarea>
    <div class="modal-actions">
      <button id="importCancelBtn">Cancel</button>
      <button class="primary" id="importConfirmBtn">Import</button>
    </div>
  </div>
</div>

<script>
  // ==================== STATE ====================
  var apiReady = false, player = null, videoId = null, pendingVideoId = null, tickTimer = null;
  var popupPlayer = null, popupVideoId = null, liveTime = 0, playerMode = 'embed'; // 'embed' or 'popup'
  var embedErrorDetected = false;

  // ==================== DOM ELEMENTS ====================
  var homeView = document.getElementById('homeView');
  var detailView = document.getElementById('detailView');
  var videoListEl = document.getElementById('videoList');
  var fabBtn = document.getElementById('fabBtn');
  var backBtn = document.getElementById('backBtn');
  var detailTitleEl = document.getElementById('detailTitle');
  var videoWrap = document.getElementById('videoWrap');
  var timeLive = document.getElementById('timeLive');
  var apiStatus = document.getElementById('apiStatus');
  var noteText = document.getElementById('noteText');
  var addBtn = document.getElementById('addBtn');
  var notesList = document.getElementById('notesList');
  var noteCount = document.getElementById('noteCount');
  var headerMenuBtn = document.getElementById('headerMenuBtn');
  var headerDropdown = document.getElementById('headerDropdown');
  var popupBtn = document.getElementById('popupBtn');
  var copyBtn = document.getElementById('copyBtn');
  var importBtn = document.getElementById('importBtn');
  var importOverlay = document.getElementById('importOverlay');
  var importTextarea = document.getElementById('importTextarea');
  var importCancelBtn = document.getElementById('importCancelBtn');
  var importConfirmBtn = document.getElementById('importConfirmBtn');
  var addOverlay = document.getElementById('addOverlay');
  var addUrlInput = document.getElementById('addUrlInput');
  var addCancelBtn = document.getElementById('addCancelBtn');
  var addConfirmBtn = document.getElementById('addConfirmBtn');
  var errorBanner = document.getElementById('errorBanner');

  // ==================== YOUTUBE IFRAME API ====================
  var tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);

  window.onYouTubeIframeAPIReady = function(){
    apiReady = true;
    apiStatus.textContent = 'Player API ready';
    if(pendingVideoId){ 
      createOrLoad(pendingVideoId); 
      pendingVideoId = null; 
    }
  };

  // ==================== UTILITIES ====================
  function extractId(raw){
    if(!raw) return null;
    raw = raw.trim();
    var patterns = [
      /youtu\.be\/([a-zA-Z0-9_-]{11})/,
      /youtube\.com\/watch\?[^#]*v=([a-zA-Z0-9_-]{11})/,
      /youtube\.com\/embed\/([a-zA-Z0-9_-]{11})/,
      /youtube\.com\/shorts\/([a-zA-Z0-9_-]{11})/,
      /youtube\.com\/live\/([a-zA-Z0-9_-]{11})/,
      /[?&]v=([a-zA-Z0-9_-]{11})/
    ];
    for(var i=0;i<patterns.length;i++){ var m = raw.match(patterns[i]); if(m) return m[1]; }
    if(/^[a-zA-Z0-9_-]{11}$/.test(raw)) return raw;
    return null;
  }

  function fmt(t){
    t = Math.max(0, Math.floor(t||0));
    var h = Math.floor(t/3600), m = Math.floor((t%3600)/60), s = t%60;
    var ss = s<10 ? '0'+s : ''+s;
    if(h>0){ var mm = m<10 ? '0'+m : ''+m; return h+':'+mm+':'+ss; }
    return m+':'+ss;
  }

  function parseTime(str){
    if(!str) return null;
    str = str.trim();
    if(/^\d+$/.test(str)) return parseInt(str,10);
    var parts = str.split(':').map(function(p){ return parseInt(p,10); });
    if(parts.some(isNaN)) return null;
    var secs = 0;
    for(var i=0;i<parts.length;i++){ secs = secs*60 + parts[i]; }
    return secs;
  }

  // ==================== STORAGE ====================
  function storageKey(id){ return 'ytnotes:' + id; }
  function loadNotes(id){ try{ var raw = localStorage.getItem(storageKey(id)); return raw ? JSON.parse(raw) : []; }catch(e){ return []; } }
  function saveNotes(id, notes){ try{ localStorage.setItem(storageKey(id), JSON.stringify(notes)); }catch(e){} }

  function loadVideosList(){ try{ var raw = localStorage.getItem('ytnotes:videos'); return raw ? JSON.parse(raw) : []; }catch(e){ return []; } }
  function saveVideosList(list){ try{ localStorage.setItem('ytnotes:videos', JSON.stringify(list)); }catch(e){} }

  function addOrTouchVideo(id){
    var list = loadVideosList();
    var idx = list.findIndex(function(v){ return v.id === id; });
    if(idx === -1){ list.unshift({ id:id, title:'YouTube video', addedAt:Date.now() }); }
    else { var item = list.splice(idx,1)[0]; list.unshift(item); }
    saveVideosList(list);
  }

  function updateVideoTitle(id, title){
    var list = loadVideosList();
    var idx = list.findIndex(function(v){ return v.id === id; });
    if(idx > -1 && list[idx].title !== title){ list[idx].title = title; saveVideosList(list); }
    if(videoId === id) detailTitleEl.textContent = title;
  }

  function deleteVideo(id){
    if(!confirm('Delete this video and all its notes?')) return;
    saveVideosList(loadVideosList().filter(function(v){ return v.id !== id; }));
    try{ localStorage.removeItem(storageKey(id)); }catch(e){}
    renderHome();
  }

  function closeAllMenus(){
    document.querySelectorAll('.note-dropdown').forEach(function(d){ d.hidden = true; });
    headerDropdown.hidden = true;
  }

  // ==================== HOME SCREEN ====================
  function renderHome(){
    videoListEl.innerHTML = '';
    var list = loadVideosList();
    if(list.length === 0){
      var p = document.createElement('div');
      p.className = 'no-notes';
      p.textContent = 'No videos yet — tap + to add one.';
      videoListEl.appendChild(p);
      return;
    }
    list.forEach(function(v){
      var card = document.createElement('div');
      card.className = 'video-card';

      var thumb = document.createElement('img');
      thumb.className = 'video-thumb';
      thumb.src = 'https://img.youtube.com/vi/' + v.id + '/hqdefault.jpg';
      thumb.alt = '';

      var info = document.createElement('div');
      info.className = 'video-info';
      var titleEl = document.createElement('div');
      titleEl.className = 'video-title';
      titleEl.textContent = v.title || 'YouTube video';
      var n = loadNotes(v.id).length;
      var countEl = document.createElement('div');
      countEl.className = 'video-count';
      countEl.textContent = n + (n === 1 ? ' note' : ' notes');
      info.appendChild(titleEl);
      info.appendChild(countEl);

      var menuWrap = document.createElement('div');
      menuWrap.className = 'note-menu-wrap';
      var menuBtn = document.createElement('button');
      menuBtn.className = 'icon-btn small';
      menuBtn.textContent = '⋮';
      menuBtn.setAttribute('aria-label', 'Video options');
      var dropdown = document.createElement('div');
      dropdown.className = 'note-dropdown';
      dropdown.hidden = true;
      var delOpt = document.createElement('button');
      delOpt.textContent = '🗑 Delete';
      delOpt.addEventListener('click', function(ev){ ev.stopPropagation(); dropdown.hidden = true; deleteVideo(v.id); });
      dropdown.appendChild(delOpt);
      menuBtn.addEventListener('click', function(ev){
        ev.stopPropagation();
        var wasHidden = dropdown.hidden;
        closeAllMenus();
        dropdown.hidden = !wasHidden;
      });
      menuWrap.appendChild(menuBtn);
      menuWrap.appendChild(dropdown);

      card.appendChild(thumb);
      card.appendChild(info);
      card.appendChild(menuWrap);
      card.addEventListener('click', function(){ openDetail(v.id); });
      videoListEl.appendChild(card);
    });
  }

  // ==================== DETAIL VIEW ====================
  function openDetail(id){
    homeView.style.display = 'none';
    fabBtn.style.display = 'none';
    detailView.hidden = false;
    var entry = loadVideosList().find(function(v){ return v.id === id; });
    detailTitleEl.textContent = (entry && entry.title) ? entry.title : 'Loading…';
    playerMode = 'embed';
    embedErrorDetected = false;
    errorBanner.hidden = true;
    loadVideoFromId(id);
  }

  function showHome(){
    detailView.hidden = true;
    homeView.style.display = '';
    fabBtn.style.display = '';
    if(popupPlayer && !popupPlayer.closed){ popupPlayer.close(); }
    renderHome();
  }

  // ==================== EMBEDDED PLAYER ====================
  function createEmbeddedPlayer(id){
    videoWrap.innerHTML = '<div id="player"></div>';
    player = new YT.Player('player', {
      videoId: id,
      playerVars: { playsinline: 1, enablejsapi: 1, rel: 0 },
      events: {
        onReady: function(){ 
          addBtn.disabled = false; 
          startTicking(); 
          tryUpdateTitle();
          apiStatus.textContent = 'Embedded player ready';
        },
        onStateChange: function(){ tryUpdateTitle(); },
        onError: function(e){
          console.log('Embed error:', e.data);
          if(e.data === 150 || e.data === 100){ // Embedding disabled
            handleEmbedError();
          }
        }
      }
    });
  }

  function handleEmbedError(){
    embedErrorDetected = true;
    errorBanner.textContent = '⚠️ Embedding disabled by video owner. Switching to popup player...';
    errorBanner.hidden = false;
    apiStatus.textContent = 'Embed blocked - using popup';
    
    // Auto-switch to popup after a brief delay
    setTimeout(function(){
      if(videoId){
        closeEmbeddedPlayer();
        openPopupPlayer(videoId);
      }
    }, 1500);
  }

  function closeEmbeddedPlayer(){
    if(player){
      try{ player.destroy(); }catch(e){}
      player = null;
    }
    videoWrap.innerHTML = '';
    if(tickTimer){ clearInterval(tickTimer); tickTimer = null; }
  }

  function tryUpdateTitle(){
    if(player && typeof player.getVideoData === 'function'){
      try{
        var d = player.getVideoData();
        if(d && d.title){ updateVideoTitle(videoId, d.title); }
      }catch(e){}
    }
  }

  function startTicking(){
    if(tickTimer) clearInterval(tickTimer);
    tickTimer = setInterval(function(){
      if(player && typeof player.getCurrentTime === 'function'){
        var t = player.getCurrentTime();
        if(typeof t === 'number'){
          liveTime = t;
          timeLive.textContent = 'Current position: ' + fmt(t);
        }
      }
    }, 500);
  }

  // ==================== POPUP PLAYER ====================
  function openPopupPlayer(id){
    popupVideoId = id;
    playerMode = 'popup';
    
    var w = 560, h = 420;
    var left = (screen.width - w) / 2;
    var top = (screen.height - h) / 2;
    
    // Get the base URL of current page
    var baseUrl = window.location.href.split('/').slice(0, -1).join('/') + '/';
    
    popupPlayer = window.open(
      baseUrl + 'popup-player.html?v=' + id,
      'ytPopup_' + id,
      'width='+w+',height='+h+',left='+left+',top='+top+',resizable=yes,scrollbars=no'
    );
    
    if(!popupPlayer || popupPlayer.closed){
      alert('Popup was blocked! Please allow popups for this site and try again.');
      playerMode = 'embed';
      return;
    }
    
    errorBanner.textContent = '🪟 Using popup player - keep the popup window open';
    errorBanner.hidden = false;
    apiStatus.textContent = 'Popup player active';
    addBtn.disabled = false;
    
    // Show mode indicator
    updatePlayerModeIndicator();
  }

  function updatePlayerModeIndicator(){
    var modeSpan = document.querySelector('.player-mode');
    if(!modeSpan){
      modeSpan = document.createElement('span');
      modeSpan.className = 'player-mode';
      apiStatus.parentNode.insertBefore(modeSpan, apiStatus.nextSibling);
    }
    modeSpan.textContent = playerMode === 'popup' ? ' POPUP' : '📺 EMBED';
    modeSpan.className = 'player-mode ' + (playerMode === 'popup' ? 'popup' : 'embed');
  }

  // Listen for messages from popup
  window.addEventListener('message', function(e){
    if(!e.data || !e.data.type) return;
    
    // Only accept messages from our popup player
    if(e.data.id !== videoId) return;
    
    if(e.data.type === 'playerReady'){
      apiStatus.textContent = 'Popup player ready';
      liveTime = 0;
      timeLive.textContent = 'Current position: 0:00';
      addBtn.disabled = false;
      updatePlayerModeIndicator();
    }
    
    if(e.data.type === 'timeUpdate'){
      liveTime = e.data.time;
      timeLive.textContent = 'Current position: ' + fmt(liveTime);
      apiStatus.textContent = 'Popup player active';
    }
    
    if(e.data.type === 'playerError'){
      errorBanner.textContent = '⚠️ Popup player error: ' + e.data.message;
      errorBanner.hidden = false;
    }
  });

  function closePopupPlayer(){
    if(popupPlayer && !popupPlayer.closed){
      try{ popupPlayer.close(); }catch(e){}
    }
    popupPlayer = null;
    popupVideoId = null;
  }

  // ==================== MAIN PLAYER LOADER ====================
  function createOrLoad(id){
    addOrTouchVideo(id);
    videoId = id;
    playerMode = 'embed';
    embedErrorDetected = false;
    errorBanner.hidden = true;
    liveTime = 0;
    timeLive.textContent = 'Current position: 0:00';
    
    // Remove old mode indicator
    var oldMode = document.querySelector('.player-mode');
    if(oldMode) oldMode.remove();
    
    if(apiReady){
      createEmbeddedPlayer(id);
    } else {
      pendingVideoId = id;
      apiStatus.textContent = 'Waiting for player API…';
    }
    
    renderNotes();
  }

  function loadVideoFromId(id){
    if(!apiReady){ 
      pendingVideoId = id; 
      apiStatus.textContent = 'Waiting for player API…'; 
      return; 
    }
    createOrLoad(id);
  }

  // ==================== NOTES ====================
  function addNote(){
    if(!videoId){ alert('Load a video first.'); return; }
    
    var text = noteText.value.trim();
    if(!text){ alert('Write a note before adding it.'); return; }
    
    var t = Math.floor(liveTime);
    var notes = loadNotes(videoId);
    notes.push({ id:'n'+Date.now()+Math.random().toString(36).slice(2,6), time:t, text:text });
    saveNotes(videoId, notes);
    noteText.value = '';
    renderNotes();
    toast('Note added at ' + fmt(t));
  }

  function seekTo(t){
    if(playerMode === 'embed' && player && typeof player.seekTo === 'function'){
      player.seekTo(t, true);
      player.playVideo();
    } else if(playerMode === 'popup' && popupPlayer && !popupPlayer.closed){
      popupPlayer.postMessage({ type:'seek', time:t, id:videoId }, '*');
      popupPlayer.postMessage({ type:'play', id:videoId }, '*');
    }
  }

  function deleteNote(id){
    if(!confirm('Delete this note?')) return;
    saveNotes(videoId, loadNotes(videoId).filter(function(n){ return n.id !== id; }));
    renderNotes();
  }

  function renderNotes(){
    notesList.innerHTML = '';
    if(!videoId){
      noteCount.textContent = '';
      var p = document.createElement('div');
      p.className = 'no-notes';
      p.textContent = 'Load a video to start taking notes.';
      notesList.appendChild(p);
      return;
    }
    var notes = loadNotes(videoId).slice().sort(function(a,b){ return a.time - b.time; });
    noteCount.textContent = notes.length + (notes.length === 1 ? ' note' : ' notes');
    if(notes.length === 0){
      var p2 = document.createElement('div');
      p2.className = 'no-notes';
      p2.textContent = 'No notes yet for this video.';
      notesList.appendChild(p2);
      return;
    }
    notes.forEach(function(n){
      var row = document.createElement('div');
      row.className = 'note';

      var timeBtn = document.createElement('button');
      timeBtn.className = 'note-time';
      timeBtn.textContent = fmt(n.time);
      timeBtn.addEventListener('click', function(){ seekTo(n.time); });

      var body = document.createElement('div');
      body.className = 'note-body';
      var textDiv = document.createElement('div');
      textDiv.className = 'note-text';
      textDiv.textContent = n.text;
      body.appendChild(textDiv);

      var menuWrap = document.createElement('div');
      menuWrap.className = 'note-menu-wrap';
      var menuBtn = document.createElement('button');
      menuBtn.className = 'icon-btn small';
      menuBtn.textContent = '⋮';
      menuBtn.setAttribute('aria-label', 'Note options');
      var dropdown = document.createElement('div');
      dropdown.className = 'note-dropdown';
      dropdown.hidden = true;
      var editOpt = document.createElement('button');
      editOpt.textContent = '✎ Edit';
      editOpt.addEventListener('click', function(ev){ ev.stopPropagation(); dropdown.hidden = true; openEdit(n, body); });
      var delOpt = document.createElement('button');
      delOpt.textContent = '🗑 Delete';
      delOpt.addEventListener('click', function(ev){ ev.stopPropagation(); dropdown.hidden = true; deleteNote(n.id); });
      dropdown.appendChild(editOpt);
      dropdown.appendChild(delOpt);
      menuBtn.addEventListener('click', function(ev){
        ev.stopPropagation();
        var wasHidden = dropdown.hidden;
        closeAllMenus();
        dropdown.hidden = !wasHidden;
      });
      menuWrap.appendChild(menuBtn);
      menuWrap.appendChild(dropdown);

      row.appendChild(timeBtn);
      row.appendChild(body);
      row.appendChild(menuWrap);
      notesList.appendChild(row);
    });
  }

  function openEdit(n, body){
    body.innerHTML = '';
    var editDiv = document.createElement('div');
    editDiv.className = 'note-edit';
    var ta = document.createElement('textarea');
    ta.value = n.text;
    var saveBtn = document.createElement('button');
    saveBtn.className = 'primary';
    saveBtn.textContent = 'Save';
    saveBtn.style.marginRight = '8px';
    saveBtn.addEventListener('click', function(){
      var newText = ta.value.trim();
      if(!newText){ alert('Note cannot be empty.'); return; }
      var notes = loadNotes(videoId);
      var idx = notes.findIndex(function(x){ return x.id === n.id; });
      if(idx > -1){ notes[idx].text = newText; saveNotes(videoId, notes); }
      renderNotes();
    });
    var cancelBtn = document.createElement('button');
    cancelBtn.textContent = 'Cancel';
    cancelBtn.addEventListener('click', renderNotes);
    editDiv.appendChild(ta);
    var btnRow = document.createElement('div');
    btnRow.appendChild(saveBtn);
    btnRow.appendChild(cancelBtn);
    editDiv.appendChild(btnRow);
    body.appendChild(editDiv);
  }

  // ==================== IMPORT/EXPORT ====================
  function buildExportText(){
    var lines = [];
    if(videoId) lines.push('URL: https://youtu.be/' + videoId);
    var notes = videoId ? loadNotes(videoId).slice().sort(function(a,b){ return a.time-b.time; }) : [];
    notes.forEach(function(n){ lines.push('[' + fmt(n.time) + '] ' + n.text.replace(/\n/g,' ')); });
    return lines.join('\n');
  }

  function parseImportText(text){
    var lines = text.split(/\r?\n/);
    var url = null, notes = [];
    var re = /^\[(\d{1,2}(?::\d{2}){1,2})\]\s*(.*)$/;
    lines.forEach(function(line){
      line = line.trim();
      if(!line) return;
      var um = line.match(/^URL:\s*(\S+)/i);
      if(um){ url = um[1]; return; }
      var m = line.match(re);
      if(m){ var t = parseTime(m[1]); if(t !== null && m[2]) notes.push({ time:t, text:m[2] }); }
    });
    return { url:url, notes:notes };
  }

  function toast(msg){
    var t = document.getElementById('toast');
    if(!t){ t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; document.body.appendChild(t); }
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._hideTimer);
    t._hideTimer = setTimeout(function(){ t.classList.remove('show'); }, 2200);
  }

  function fallbackCopy(text){
    try{
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
      toast('Copied to clipboard');
    }catch(e){ alert('Could not copy automatically. Select and copy manually:\n\n' + text); }
  }

  function copyText(text){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ toast('Copied to clipboard'); }).catch(function(){ fallbackCopy(text); });
    } else { fallbackCopy(text); }
  }

  function performImport(){
    var parsed = parseImportText(importTextarea.value);
    if(!parsed.notes.length && !parsed.url){ alert('No valid data found to import.'); return; }
    var newId = parsed.url ? extractId(parsed.url) : null;
    var targetId = newId || videoId;
    if(!targetId){ alert('Include a "URL:" line in the pasted text.'); return; }
    var existing = loadNotes(targetId);
    var added = 0;
    parsed.notes.forEach(function(n){
      var dup = existing.some(function(e){ return e.time === n.time && e.text === n.text; });
      if(!dup){ existing.push({ id:'n'+Date.now()+Math.random().toString(36).slice(2,6), time:n.time, text:n.text }); added++; }
    });
    saveNotes(targetId, existing);
    importOverlay.hidden = true;
    importTextarea.value = '';
    if(newId && newId !== videoId){ openDetail(newId); } else { renderNotes(); }
    toast('Imported ' + added + ' note' + (added===1 ? '' : 's'));
  }

  // ==================== EVENT LISTENERS ====================
  backBtn.addEventListener('click', showHome);
  addBtn.addEventListener('click', addNote);

  headerMenuBtn.addEventListener('click', function(ev){
    ev.stopPropagation();
    var wasHidden = headerDropdown.hidden;
    closeAllMenus();
    headerDropdown.hidden = !wasHidden;
  });
  
  popupBtn.addEventListener('click', function(){
    closeAllMenus();
    if(videoId){
      if(playerMode === 'embed'){
        closeEmbeddedPlayer();
      }
      openPopupPlayer(videoId);
    }
  });
  
  copyBtn.addEventListener('click', function(){ closeAllMenus(); if(videoId) copyText(buildExportText()); });
  importBtn.addEventListener('click', function(){ closeAllMenus(); importTextarea.value = ''; importOverlay.hidden = false; importTextarea.focus(); });
  importCancelBtn.addEventListener('click', function(){ importOverlay.hidden = true; });
  importConfirmBtn.addEventListener('click', performImport);
  importOverlay.addEventListener('click', function(ev){ if(ev.target === importOverlay) importOverlay.hidden = true; });

  fabBtn.addEventListener('click', function(){ addUrlInput.value = ''; addOverlay.hidden = false; addUrlInput.focus(); });
  addCancelBtn.addEventListener('click', function(){ addOverlay.hidden = true; });
  addConfirmBtn.addEventListener('click', function(){
    var id = extractId(addUrlInput.value);
    if(!id){ alert('Could not find a valid YouTube video in that link.'); return; }
    addOverlay.hidden = true;
    openDetail(id);
  });
  addUrlInput.addEventListener('keydown', function(e){ if(e.key === 'Enter') addConfirmBtn.click(); });

  document.addEventListener('click', closeAllMenus);

  // Cleanup on page unload
  window.addEventListener('beforeunload', function(){
    if(popupPlayer && !popupPlayer.closed){
      try{ popupPlayer.close(); }catch(e){}
    }
  });

  // Initialize
  renderHome();
</script>
</body>
</html>
